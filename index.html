<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="theme-color" content="#141a17">
  <title>潮鳴りの狩場</title>
  <script type="module" crossorigin src="./assets/index-h8jObzSe.js"></script>
  <link rel="modulepreload" crossorigin href="./assets/three-DdBQHoAf.js">
  <link rel="stylesheet" crossorigin href="./assets/index-ER6vWsLq.css">
</head>
<body>
  <canvas id="view" aria-label="3D闘技場"></canvas>
  <section id="hud" hidden aria-label="戦闘情報">
    <div class="battle-top">
      <div class="battle-gauges">
        <div class="gauge life" id="hp" role="meter" aria-label="体力"><i></i></div>
        <div class="gauge stamina" id="stamina" role="meter" aria-label="スタミナ"><i></i></div>
        <div id="flare-status" hidden>
          <div class="gauge energy" id="energy" role="meter" aria-label="エネルギー"><i></i></div>
          <span id="energy-value"></span>
        </div>
        <div class="boss-status">
          <span id="boss-name"></span>
          <div class="gauge boss-health" id="boss-hp" role="meter" aria-label="敵の体力"><i></i></div>
        </div>
      </div>
      <button id="pause" aria-label="一時停止"></button>
    </div>
    <div class="battle-alerts">
      <span id="rage" hidden>怒り</span>
      <div id="callout" aria-live="polite"></div>
    </div>
    <div id="charge-meter" hidden><i></i><b>溜め</b></div>
    <div id="quest-banner" hidden></div>
    <div id="numbers"></div>
    <div id="key-hint">WASD 移動　 J 攻撃　 K 溜め　 Space 回避　 L ガード　 Q ロックオン</div>
  </section>
  <section id="touch" hidden aria-label="タッチ操作">
    <div id="stick-zone">
      <div id="stick" role="img" aria-label="移動スティック"><i></i></div>
    </div>
    <button class="target-button" data-action="lock" aria-label="ロックオン">照準</button>
    <div class="actions">
      <button data-action="guard">ガード</button>
      <button data-action="attack">斬撃</button>
      <button data-action="dodge">回避</button>
      <button data-action="charge">溜め斬り<small>長押し</small></button>
    </div>
  </section>
  <div id="shade"></div>
  <main id="menu">
    <div class="menu-card" id="panel"></div>
    <div class="site-mark">SHIOSAI <span>／</span> HUNT</div>
  </main>
</body>
</html>
